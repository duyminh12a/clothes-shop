{% extends 'admin_panel/base_admin.html' %}

{% block title %}Thêm Sản Phẩm Mới — Quản Trị Nếp Form{% endblock %}
{% block header_title %}Thêm Phôi Áo Mới Vào Xưởng{% endblock %}

{% block content %}
<div class="max-w-3xl space-y-6">
  
  <div class="flex items-center gap-3">
    <a href="{% url 'admin_panel:products' %}" class="inline-flex items-center gap-1.5 text-xs font-bold text-gray-500 hover:text-gray-900 transition">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      <span>Quay lại danh sách sản phẩm</span>
    </a>
  </div>

  <div class="bg-white rounded-3xl p-8 border border-gray-200/80 shadow-xs">
    <form method="POST" class="space-y-6">
      {% csrf_token %}

      <div>
        <label class="block text-xs font-bold text-gray-800 uppercase tracking-wider mb-2">Tên sản phẩm *</label>
        <input type="text" name="name" required placeholder="VD: Áo Thun Cổ Tròn Loose Fit" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-xs font-semibold focus:outline-none focus:border-nep-green text-gray-800">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-800 uppercase tracking-wider mb-2">Loại sản phẩm *</label>
          <select name="product_type" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-xs font-semibold focus:outline-none focus:border-nep-green text-gray-800">
            {% for t in product_types %}
              <option value="{{ t.id }}">{{ t.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-800 uppercase tracking-wider mb-2">Giá cơ bản (VNĐ) *</label>
          <input type="number" name="base_price" required value="280000" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-xs font-semibold focus:outline-none focus:border-nep-green text-gray-800">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-800 uppercase tracking-wider mb-2">Chất liệu vải</label>
          <input type="text" name="fabric_info" value="Cotton 100% 2-chiều (240gsm)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-xs font-semibold focus:outline-none focus:border-nep-green text-gray-800">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-800 uppercase tracking-wider mb-2">Phom dáng</label>
          <input type="text" name="fit_type" value="Phối unisex" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-xs font-semibold focus:outline-none focus:border-nep-green text-gray-800">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-800 uppercase tracking-wider mb-2">Mô tả sản phẩm</label>
        <textarea name="description" rows="3" placeholder="Đặc điểm nổi bật của chất liệu vải, kiểu may..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-nep-green text-gray-800"></textarea>
      </div>

      <div class="flex items-center gap-3">
        <input type="checkbox" name="is_featured" id="is_featured" checked class="w-4 h-4 accent-nep-dark">
        <label for="is_featured" class="text-xs font-bold text-gray-800">Hiển thị nổi bật trên Trang Chủ</label>
      </div>

      <div class="pt-4 border-t border-gray-100 flex items-center justify-end gap-3">
        <a href="{% url 'admin_panel:products' %}" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-100 transition">Hủy bỏ</a>
        <button type="submit" class="px-6 py-2.5 bg-nep-dark hover:bg-gray-800 text-white rounded-xl text-xs font-bold uppercase tracking-wider shadow-xs transition">
          Lưu sản phẩm
        </button>
      </div>
    </form>
  </div>

</div>
{% endblock %}
